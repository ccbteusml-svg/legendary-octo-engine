<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#1a202c">
    
    <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIlRlcmFQbGF5ZXIiLAogICJzaG9ydF9uYW1lIjogIlRlcmFQbGF5ZXIiLAogICJzdGFydF91cmwiOiAiLiIsCiAgImRpc3BsYXkiOiAic3RhbmRhbG9uZSIsCiAgImJhY2tncm91bmRfY29sb3IiOiAiIzFhMjAyYyIsCiAgInRoZW1lX2NvbG9yIjogIiMxYTIwMmMiLAogICJpY29ucyI6IFt7CiAgICAic3JjIjogImh0dHBzOi8vY2RuLWljb25zLXBuZy5mbGF0aWNvbi5jb20vNTEyLzU5NjgvNTk2ODg5Ni5wbmciLAogICAgInNpemVzIjogIjUxMng1MTIiLAogICAgInR5cGUiOiAiaW1hZ2UvcG5nIgogIH1dCn0=">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1a202c;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Container Principal */
        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        h2 { text-align: center; margin-bottom: 10px; color: #4fd1c5; }

        /* Área de Input */
        .input-group {
            display: flex;
            gap: 10px;
            background: #2d3748;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16px;
            padding: 5px;
        }
        
        button#loadBtn {
            background-color: #4fd1c5;
            color: #1a202c;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        
        button#loadBtn:active { transform: scale(0.95); }

        /* Área do Vídeo */
        .video-wrapper {
            width: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16/9;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5);
        }

        video {
            width: 100%;
            height: 100%;
            display: none; /* Escondido até carregar */
        }

        /* Mensagens de Status */
        #status {
            text-align: center;
            font-size: 14px;
            color: #a0aec0;
            min-height: 20px;
        }
        
        .loading-spinner {
            border: 4px solid rgba(255,255,255,0.1);
            border-left-color: #4fd1c5;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            display: none;
            position: absolute;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .info-box {
            background: rgba(79, 209, 197, 0.1);
            border: 1px solid #4fd1c5;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            margin-top: 20px;
            color: #e6fffa;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>TeraPlayer ☁️</h2>
        
        <div class="input-group">
            <input type="text" id="urlInput" value="https://1024terabox.com/s/1bq254_vjTvJfQ7x3xmnJmw" placeholder="Cole o link TeraBox aqui...">
            <button id="loadBtn" onclick="fetchVideo()">▶ Play</button>
        </div>

        <div id="status">Cole o link e clique em Play</div>

        <div class="video-wrapper">
            <div class="loading-spinner" id="spinner"></div>
            <video id="videoPlayer" controls playsinline>
                Seu navegador não suporta vídeos HTML5.
            </video>
        </div>

        <div class="info-box">
            <strong>Nota:</strong> Este app usa uma API pública para tentar extrair o vídeo. Se o TeraBox mudar o sistema deles, o vídeo pode não carregar. Links expirados ou pastas privadas não funcionarão.
        </div>
    </div>

    <script>
        async function fetchVideo() {
            const input = document.getElementById('urlInput');
            const video = document.getElementById('videoPlayer');
            const status = document.getElementById('status');
            const spinner = document.getElementById('spinner');
            const url = input.value.trim();

            if (!url) {
                status.innerText = "Por favor, insira um link válido.";
                return;
            }

            // UI Reset
            video.style.display = 'none';
            video.pause();
            spinner.style.display = 'block';
            status.innerText = "Processando link... (isso pode levar uns segundos)";

            try {
                // Usando uma API pública de terceiros para resolver o link do TeraBox
                // Agradecimentos ao projeto open source 'teradl-api'
                const apiUrl = `https://teradl.shraj.workers.dev/?url=${encodeURIComponent(url)}`;
                
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (data && data.response && data.response.length > 0) {
                    const videoData = data.response[0];
                    // Tenta pegar a melhor resolução disponível (HD ou Fast Download)
                    const videoSrc = videoData.resolutions['HD Video'] || videoData.resolutions['Fast Download'];
                    
                    if (videoSrc) {
                        video.src = videoSrc;
                        video.style.display = 'block';
                        status.innerText = `Reproduzindo: ${videoData.title}`;
                        spinner.style.display = 'none';
                        video.play();
                    } else {
                        throw new Error("Link direto não encontrado na resposta.");
                    }
                } else {
                    throw new Error("Falha ao obter dados do vídeo.");
                }

            } catch (error) {
                console.error(error);
                spinner.style.display = 'none';
                status.innerHTML = `<span style="color: #fc8181;">Erro: Não foi possível carregar. O link pode ser privado ou a API está ocupada.</span>`;
            }
        }

        // PWA Service Worker (Básico para instalação)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(() => { console.log('Service Worker Registered'); });
        }
    </script>
</body>
</html>
